const $=id=>document.getElementById(id);
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const state={example:0,step:0};
function value(v){if(v===null)return 'None';if(typeof v==='object'){if(v.ptr)return '<span class="ptr">'+esc(v.ptr)+'</span>';if(v.function)return esc(v.function)}return esc(typeof v==='string'?JSON.stringify(v):v)}
function syntax(s){return s.split(/("(?:[^"\\]|\\.)*"|\b(?:fun|return|if|else|while|global)\b|\b\d+\b)/g).map((part,i)=>i%2?'<span class="'+(/^\d|^"/.test(part)?'literal':'kw')+'">'+esc(part)+'</span>':esc(part)).join('')}
function render(){
 const d=DATA[state.example];state.step=Math.max(0,Math.min(state.step,d.trace.length-1));
 const snap=d.trace[state.step],active=snap.frames.at(-1);
 $('source').innerHTML=syntax(d.source);$('output').textContent=snap.output.join('\n');
 $('globals').innerHTML=Object.entries(snap.globals).map(([n,v])=>'<span>'+esc(n)+' = '+value(v)+'</span>').join('')||'<span class="empty">—</span>';

 function stackValue(v){
  if(v&&typeof v==='object'&&v.ptr){
   const o=snap.heap[v.ptr];
   if(o?.kind==='Closure')return value(v)+' <span class="stack-description">Closure('+esc(o.function)+')</span>';
   if(o?.kind==='Reference')return value(v)+' <span class="stack-description">Reference = '+value(o.value)+'</span>';
   if(o?.kind==='Record')return value(v)+' <span class="stack-description">Record</span>';
  }
  return value(v);
 }
 $('frames').innerHTML=[...snap.frames].reverse().map((f,i)=>{
  const depth=snap.frames.length-1-i;
  const operands=f.stack.map((v,j)=>({v,j})).reverse();
  return '<div class="frame '+(i===0?'active':'')+'"><div class="framehead"><span><b>'+esc(f.function)+'</b><br><span class="frame-state">Frame '+depth+'</span></span><span>'+'IP '+f.ip+'</span></div><div class="framebody"><div class="frame-locals"><div class="smalllabel">Locals</div><div class="locals">'+(Object.entries(f.locals).map(([n,v])=>esc(n)+' = '+stackValue(v)).join('<br>')||'<span class="empty">Empty</span>')+'</div>'+(f.refs.length?'<div class="smalllabel" style="margin-top:8px">References</div><div class="locals">'+f.refs.map(stackValue).join('<br>')+'</div>':'')+'</div><div class="frame-operands"><div class="smalllabel">Operand stack ('+f.stack.length+')</div><div class="stack">'+(operands.map(({v,j},k)=>'<div class="cell '+(k===0?'stack-top':'')+'"><span class="slot-index">'+j+'</span><span class="slot-value">'+stackValue(v)+'</span><span class="slot-end">'+(k===0?'top':k===operands.length-1?'bottom':'')+'</span></div>').join('')||'<div class="cell empty">Empty</div>')+'</div></div></div></div>';
 }).join('')||'<div class="end">Finished</div>';

 $('heap').innerHTML=Object.entries(snap.heap).map(([id,o])=>'<div class="heaprow"><span class="ptr">'+id+'</span><span class="object">'+o.kind+'</span><div class="fields">'+(o.kind==='Closure'?'function = '+esc(o.function)+'<br>captures = ['+o.refs.map(value).join(', ')+']':o.kind==='Reference'?'value = '+value(o.value):Object.entries(o.fields).map(([k,v])=>esc(k)+' = '+value(v)).join('<br>'))+'</div></div>').join('')||'<div class="body empty">—</div>';
 $('range').max=d.trace.length-1;$('range').value=state.step;$('progress').textContent=state.step+' / '+(d.trace.length-1);$('back').disabled=state.step===0;$('next').disabled=state.step===d.trace.length-1;
 $('status').textContent=active?active.function+' · IP '+active.ip:'Finished';

 function functionBlock(fn,depth=0){
  const indent='  '.repeat(depth),line=(text,cls='')=>'<div class="bc-line '+cls+'">'+ '<span class="bc-ip" aria-hidden="true"></span><span class="bc-text">'+esc(text)+'</span></div>';
  let html=line(indent+'function {');
  const children=d.functions.filter(x=>x.path.startsWith(fn.path+'.')&&x.path.split('.').length===fn.path.split('.').length+1);
  if(fn.path==='main'||children.length){
   html+=line(indent+'  functions = [');
   if(fn.path==='main')for(const name of ['print','input','intcast'])html+=line(indent+'    <builtin '+name+'>,','dim');
   for(let i=0;i<children.length;i++){html+=functionBlock(children[i],depth+2);if(i<children.length-1)html+=line(indent+'    ,')}
   html+=line(indent+'  ],');
  }else html+=line(indent+'  functions = [],');
  for(const key of ['constants','parameter_count','local_vars','local_ref_vars','free_vars','names']){
   const v=fn.fields[key];if(key==='parameter_count')html+=line(indent+'  '+key+' = '+v+',');
   else html+=line(indent+'  '+key+' = ['+v+'],');
  }
  html+=line(indent+'  instructions = [');
  fn.instructions.forEach((ins,i)=>{const current=active?.function===fn.path&&active.ip===i;html+='<div class="bc-line '+(current?'current':'')+'"'+(current?' id="current-instruction"':'')+'>'+'<span class="bc-ip">'+i+'</span><span class="bc-text">'+esc(indent+'    '+ins)+'</span></div>'});
  return html+line(indent+'  ]')+line(indent+'}');
 }
 $('instructions').innerHTML=functionBlock(d.functions.find(fn=>fn.path==='main'));
 const box=$('instructions'),current=box.querySelector('.current');
 if(current)box.scrollTop=Math.max(0,current.offsetTop-box.offsetTop-box.clientHeight/2);

}
function loadExample(i,updateHash=true){
 if(!Number.isInteger(i)||i<0||i>=DATA.length)return;
 state.example=i;state.step=0;
 $('examples').value=String(i);
 $('range').max=String(DATA[i].trace.length-1);$('range').value=String(state.step);
 for(const id of ['frames','heap','instructions'])$(id).scrollTop=0;
 if(updateHash)history.replaceState(null,'','#'+DATA[i].slug);
 render();
}
function advance(delta){state.step+=delta;render()}
$('examples').replaceChildren(...DATA.map((d,i)=>new Option(d.title,String(i))));
$('examples').addEventListener('change',e=>loadExample(Number(e.target.value)));
$('back').addEventListener('click',()=>advance(-1));$('next').addEventListener('click',()=>advance(1));$('reset').addEventListener('click',()=>loadExample(state.example));
$('range').addEventListener('input',e=>{state.step=Number(e.target.value);render()});
$('full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}});
window.addEventListener('keydown',e=>{if(e.target.closest('select,input,textarea,button')||e.altKey||e.metaKey||e.ctrlKey)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();advance(e.key==='ArrowRight'?1:-1)}});
window.addEventListener('hashchange',()=>{const i=DATA.findIndex(d=>'#'+d.slug===location.hash);if(i>=0)loadExample(i,false)});
loadExample(Math.max(0,DATA.findIndex(d=>'#'+d.slug===location.hash)),false);
</script></body></html>
