{% extends "base.html" %}
{% block main %}
{% if page.ancestors | length > 1 %}
{% set parent_path = page.ancestors | last %}
{% set parent = get_section(path=parent_path) %}
<p class="breadcrumb"><a href="{{ parent.permalink | safe }}">{{ parent.title }}</a></p>
{% endif %}
<h1>{{ page.title }}</h1>
{{ page.content | safe }}
{% endblock main %}
